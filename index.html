<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NDR Tech</title>

    <link rel="stylesheet" href="register.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" href="image/favicon.png">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="header">
            <img src="image/ndr-tech-logo.png" alt="NDR Tech logo" class="brand-logo">
            <h1>NDR TECH TECHNICAL DEPARTMENT SYSTEM</h1>
            <p>Create Company Account</p>
        </div>

        <form id="registerForm">

            <div class="input-group">
                <i class="fas fa-building"></i>
                <input type="text" id="companyName" placeholder="Company Name" required>
            </div>

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="ownerName" placeholder="Owner Name" required>
            </div>

            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="text" id="phone" placeholder="Phone Number" required>
            </div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class="fas fa-user-lock"></i>
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit">
                Create Account
            </button>
            <div class="login-link">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </form>

    </div>

</div>

<script src="register.js"></script>

</body>
</html>
